name: Generate and publish research daily
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'site/index.html'
      - 'site/assets/**'
      - 'scripts/**'
      - 'content/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '10 23 * * *' # 07:10 Asia/Shanghai; may be delayed
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      generation: ${{ steps.generate.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Generate daily issue
        id: generate
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
        run: python scripts/generate.py
      - run: python scripts/build.py
      - name: Commit generated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ site/index.json site/papers.json site/issues/ site/papers/
          if ! git diff --cached --quiet; then git commit -m "Update daily research archive" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Report digest generation failure
        if: ${{ always() && needs.build.outputs.generation == 'failure' }}
        run: |
          echo "::error::Daily digest generation failed. See the Generate daily issue step for details."
          exit 1
